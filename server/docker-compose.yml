# Local development stack: Postgres 15 + the API, both in Docker.
#
#   docker compose up -d db            # start the database
#   docker compose run --rm seed       # migrate + seed + seed:dense
#   docker compose up -d api           # start the API on :3000
#
# DATABASE_URL is pinned to the local `db` service here — production Supabase
# creds live only in .env and are never used by this file.
#
# (docker-compose.prod.yml — referenced in the Dockerfile header — is the
#  amd64 production stack; this is the local-dev counterpart.)

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: beverage
      POSTGRES_PASSWORD: beverage_dev
      POSTGRES_DB: beverage_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beverage -d beverage_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    image: beverage-api:local
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://beverage:beverage_dev@db:5432/beverage_dev?schema=public
      DIRECT_URL: postgresql://beverage:beverage_dev@db:5432/beverage_dev?schema=public
      JWT_SECRET: local_dev_jwt_secret_at_least_32_characters_long
      JWT_ACCESS_TTL_SECONDS: 86400
      JWT_REFRESH_TTL_SECONDS: 2592000
      BCRYPT_COST: 12
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # One-off task container built from the `build` stage (has tsx + dev deps).
  # `docker compose run --rm seed` applies migrations, then seeds.
  seed:
    build:
      context: .
      target: build
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://beverage:beverage_dev@db:5432/beverage_dev?schema=public
      DIRECT_URL: postgresql://beverage:beverage_dev@db:5432/beverage_dev?schema=public
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - "npx prisma migrate deploy && npm run prisma:seed && npm run prisma:seed:dense"

volumes:
  pgdata:
